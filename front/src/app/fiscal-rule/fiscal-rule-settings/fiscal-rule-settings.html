<main class="mx-auto max-w-4xl px-4 py-8">
  <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <h1 class="text-3xl font-bold text-gray-900 dark:text-white">
        {{ 'fiscalRuleSettings.title' | translate }}
      </h1>
      <!-- Stable spinner area: prevents CLS -->
      <div class="min-w-[1.5rem]" aria-live="polite" aria-atomic="true">
        @if (list.isLoading()) {
          <app-loading-spinner class="h-5 w-5 text-gray-500 dark:text-gray-400" role="status" aria-label="{{ 'fiscalRuleSettings.loading' | translate }}"></app-loading-spinner>
        }
      </div>
    </div>
    <button
      type="button"
      (click)="list.onCreate()"
      class="inline-flex cursor-pointer items-center gap-1.5 rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 dark:bg-blue-500 dark:hover:bg-blue-600"
    >
      <svg class="h-4 w-4" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      {{ 'fiscalRuleList.createButton' | translate }}
    </button>
  </div>

  <app-fiscal-rule-list #list />
</main>
